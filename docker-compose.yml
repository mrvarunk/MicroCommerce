version: '3.8'

services:
  # =======================
  # Zookeeper
  # =======================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.1
    container_name: zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - shop-network

  # =======================
  # Kafka
  # =======================
  kafka:
    image: confluentinc/cp-kafka:7.3.1
    container_name: kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - shop-network

  # =======================
  # Redis
  # =======================
  redis:
    image: redis:7.0
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - shop-network

  # =======================
  # MySQL - Order Service
  # =======================
  mysql-order-service:
    image: mysql:8.0
    container_name: mysql-order-service
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: order_db
    ports:
      - "3307:3306"
    volumes:
      - mysql-order-service-data:/var/lib/mysql
    networks:
      - shop-network

  # =======================
  # MySQL - Identity Service
  # =======================
  mysql-identity-service:
    image: mysql:8.0
    container_name: mysql-identity-service
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: user_db
    ports:
      - "3308:3306"
    volumes:
      - mysql-identity-service-data:/var/lib/mysql
    networks:
      - shop-network

  # =======================
  # MySQL - Payment Service
  # =======================
  mysql-payment-service:
    image: mysql:8.0
    container_name: mysql-payment-service
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: payment_db
    ports:
      - "3309:3306"
    volumes:
      - mysql-payment-service-data:/var/lib/mysql
    networks:
      - shop-network

  # =======================
  # MySQL - Product Service
  # =======================
  mysql-product-service:
    image: mysql:8.0
    container_name: mysql-product-service
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: product_db
    ports:
      - "3310:3306"
    volumes:
      - mysql-product-service-data:/var/lib/mysql
    networks:
      - shop-network

  # =======================
  # MySQL - Stock Service
  # =======================
  mysql-stock-service:
    image: mysql:8.0
    container_name: mysql-stock-service
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: stock_db
    ports:
      - "3311:3306"
    volumes:
      - mysql-stock-service-data:/var/lib/mysql
    networks:
      - shop-network

volumes:
  mysql-order-service-data:
  mysql-identity-service-data:
  mysql-payment-service-data:
  mysql-product-service-data:
  mysql-stock-service-data:
  redis-data:

networks:
  shop-network:
    driver: bridge