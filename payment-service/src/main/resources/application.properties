spring.application.name=payment-service
server.port=8085

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql-payment:3306/payment_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Redis Configuration (FAIL-SAFE WITH DEFAULTS)
spring.redis.host=${SPRING_REDIS_HOST:redis}
spring.redis.port=${SPRING_REDIS_PORT:6379}
spring.redis.password=${SPRING_REDIS_PASSWORD:}
spring.redis.timeout=${SPRING_REDIS_TIMEOUT:60000}

# Kafka Configuration (OPTIONAL - graceful degradation if Kafka unavailable)
spring.kafka.consumer.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
spring.kafka.consumer.group-id=payment
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.max-poll-records=100
spring.kafka.consumer.session-timeout-ms=30000
spring.kafka.consumer.request-timeout-ms=60000
spring.kafka.consumer.enable-auto-commit=true
spring.kafka.listener.ack-mode=batch
spring.kafka.order-topic.name=order_topics

# Kafka Connection Retry Strategy - Exponential backoff
spring.kafka.retry.topic.enabled=true
spring.kafka.retry.topic.max.attempts=3
spring.kafka.retry.topic.delay.ms=1000
spring.kafka.retry.topic.multiplier=2.0
spring.kafka.retry.topic.max.delay.ms=10000

# Zipkin/Tracing Configuration (OPTIONAL)
spring.zipkin.base-url=${SPRING_ZIPKIN_BASE_URL:http://127.0.0.1:9411/}
spring.sleuth.sampler.probability=0.1

# Actuator/Management Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.tracing.sampling.probability=0.1

# Eureka Service Discovery Configuration (OPTIONAL - can be disabled for Kubernetes)
